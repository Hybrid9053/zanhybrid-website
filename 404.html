<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | ZanHybrid</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 140px 5% 60px; }
    .not-found h1 { font-family: 'Cinzel', serif; font-size: 4rem; color: var(--gold-primary); margin-bottom: 10px; }
    .not-found p { color: var(--white-muted); margin-bottom: 24px; }

    /* THEME TOGGLE */
    [data-theme="light"] {
      --black-deep: #f5f2e8;
      --black-panel: #ffffff;
      --white: #1a1a1a;
      --white-muted: #55524a;
    }
    [data-theme="light"] body { background: var(--black-deep); color: var(--white); }
    .theme-toggle-btn {
      background: none; border: 1px solid rgba(255,215,0,0.3); color: var(--gold-primary);
      border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer;
      transition: var(--transition); margin-right: 14px;
    }
    .theme-toggle-btn:hover { background: rgba(255,215,0,0.1); }

    /* WHATSAPP FLOAT */
    .whatsapp-float {
      position: fixed; bottom: 24px; right: 24px; z-index: 1002;
      width: 56px; height: 56px; border-radius: 50%;
      background: #25D366; display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; text-decoration: none; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      transition: var(--transition);
    }
    .whatsapp-float:hover { transform: scale(1.08); }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="images/logo.png" alt="ZanHybrid Logo" />
    <div class="nav-logo-text">
      <span class="nav-logo-name">ZanHybrid</span>
      <span class="nav-logo-tag">Anyone · Anywhere · Anytime</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="pages/about.html">About</a></li>
    <li><a href="pages/services.html">Services</a></li>
    <li><a href="pages/portfolio.html">Portfolio</a></li>
    <li><a href="pages/blog.html">Blog</a></li>
    <li><a href="pages/contact.html" class="nav-cta">Contact Us</a></li>
  </ul>
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light/dark theme">🌙 Dark</button>
  <div class="hamburger" role="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="not-found">
  <h1>404</h1>
  <p>The page you're looking for doesn't exist.</p>
  <a href="index.html" class="btn-primary">Back to Home →</a>
</div>

<a href="https://wa.me/255622789053" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">💬</a>

<script>
(function(){
  var stored = localStorage.getItem('zanhybrid-theme');
  if (stored === 'light') document.documentElement.setAttribute('data-theme', 'light');
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.textContent = stored === 'light' ? '☀️ Light' : '🌙 Dark';
    btn.addEventListener('click', function(){
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('zanhybrid-theme', 'dark');
        btn.textContent = '🌙 Dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('zanhybrid-theme', 'light');
        btn.textContent = '☀️ Light';
      }
    });
  }
})();
</script>
<script src="js/main.js"></script>
</body>
</html>
